services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-air_quality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-air_quality_dev}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./server
    image: air-quality-tracker-server:local
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-air_quality}:${POSTGRES_PASSWORD:-air_quality_dev}@timescaledb:5432/${POSTGRES_DB:-air_quality}
    depends_on:
      timescaledb:
        condition: service_healthy

  server:
    build:
      context: ./server
    image: air-quality-tracker-server:local
    restart: unless-stopped
    env_file:
      - path: server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-air_quality}:${POSTGRES_PASSWORD:-air_quality_dev}@timescaledb:5432/${POSTGRES_DB:-air_quality}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api/v1
    image: air-quality-tracker-client:local
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  timescaledb_data:
